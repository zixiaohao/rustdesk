name: build-controller

# 控制端（含「入网审批」tab）完整构建（全平台）。
# 日常迭代请用 build-controller-win.yml（仅 Windows x64，~40min）。
# 本工作流改为手动触发，仅在需要全平台产物时使用。
#
# permissions: 嵌套工作流里有 job（generate-sbom / publish-signed-update-metadata）
# 请求 contents: write，调用方必须显式授予，否则 startup_failure。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-controller:
    uses: ./.github/workflows/flutter-build.yml
    with:
      upload-artifact: true
      upload-tag: "controller"
